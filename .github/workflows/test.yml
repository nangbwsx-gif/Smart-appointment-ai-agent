name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"   # 每天 UTC 18:30 跑一次完整测试

jobs:
  mock-tests:
    name: 路由层测试（无需凭据）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # 只跑不依赖真实 LLM 的用例：LLM 相关用例已标记 pytest.mark.llm
      - name: 运行非 LLM 用例
        run: python -m pytest -q -m "not llm"

  llm-tests:
    name: 完整测试（需要 LLM 凭据）
    runs-on: ubuntu-latest
    # job 级 if 里不能引用 secrets，改成在步骤里用 env 判断，未配置凭据就跳过
    env:
      MODEL_PROVIDER: openai-compatible
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.minimax.chat/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'MiniMax-M3.1-Flash' }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'minimax' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL || 'https://api.minimax.chat/v1' }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'embo-01' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: 未配置凭据时跳过
        if: ${{ env.LLM_API_KEY == '' }}
        run: echo "未配置 LLM_API_KEY，跳过完整测试"

      - name: 运行完整用例
        if: ${{ env.LLM_API_KEY != '' }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
